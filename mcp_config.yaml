name: qtick-mcp
description: QTick MCP service for managing leads and reports
protocol_version: "1"
transport: http
base_url: https://urchin-app-ax5kp.ondigitalocean.app
entry_point: main.py

auth:
  type: oauth2
  client_id: dummy-client-id
  client_secret: dummy-client-secret
  authorization_url: https://urchin-app-ax5kp.ondigitalocean.app/oauth/authorize
  token_url: https://urchin-app-ax5kp.ondigitalocean.app/oauth/token
  scopes: []
  grant_type: authorization_code

tools:
  - name: create_lead
    description: Create a new sales lead in QTick
    method: POST
    path: /create_lead
    parameters:
      - name: name
        type: string
        required: true
        description: Full name of the lead
      - name: email
        type: string
        required: true
        description: Email address of the lead
      - name: source
        type: string
        required: false
        description: Source channel (e.g., Website, Referral)
      - name: company
        type: string
        required: false
        description: Company name
      - name: phone
        type: string
        required: false
        description: Phone number

  - name: list_leads
    description: List existing sales leads
    method: GET
    path: /list_leads

  - name: list_reports
    description: Retrieve reports summary
    method: GET
    path: /list_reports
