name: qtick-mcp
description: MCP service to manage leads and reports in QTick
protocol_version: 1
transport: http
base_url: https://urchin-app-ax5kp.ondigitalocean.app
entry_point: main.py

auth:
  type: oauth2
  client_id: dummy-client-id
  client_secret: dummy-client-secret
  authorization_url: https://urchin-app-ax5kp.ondigitalocean.app/oauth/authorize
  token_url: https://urchin-app-ax5kp.ondigitalocean.app/oauth/token
  scopes: []
  grant_type: authorization_code

tools:
  - name: create_lead
    description: Create a new sales lead in QTick
    method: POST
    path: /create_lead
  - name: list_leads
    description: List existing sales leads
    method: GET
    path: /list_leads
  - name: list_reports
    description: Retrieve reports summary
    method: GET
    path: /list_reports
